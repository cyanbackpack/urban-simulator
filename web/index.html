<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityBench — 편집 &amp; 채점</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header>
    <h1>CityBench <span class="sub">편집 &amp; 채점</span></h1>
    <div class="controls">
      <label>지형
        <select id="terrain-select"></select>
      </label>
      <button id="btn-reference" title="이 지형의 기준 제출물을 불러오기">기준 제출물</button>
      <label class="file-label">업로드<input id="file-input" type="file" accept="application/json,.json"></label>
      <button id="btn-export" title="현재 제출물을 JSON으로 내보내기">내보내기</button>
      <button id="btn-score" class="primary" disabled>채점</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <div id="toolbar" class="toolbar">
    <div class="tool-group" role="group" aria-label="도구">
      <button class="tool" data-mode="select" title="선택 / 이동 (V)">↖ 선택</button>
      <button class="tool" data-mode="zone" title="구역 그리기 (Z)">▭ 구역</button>
      <button class="tool" data-mode="transit" title="교통 그리기 (T)">／ 교통</button>
      <button class="tool" data-mode="facility" title="시설 배치 (F)">◇ 시설</button>
      <button class="tool" data-mode="station" title="역 배치 (S)">● 역</button>
      <button class="tool" data-mode="hub" title="허브 배치 (H)">◉ 허브</button>
      <button class="tool" data-mode="event" title="이벤트 배치 (E)">◎ 이벤트</button>
    </div>

    <div class="tool-group palette" id="palette-zone">
      <select id="zone-use" class="swatch-select"></select>
    </div>
    <div class="tool-group palette hidden" id="palette-transit">
      <select id="transit-type"></select>
    </div>
    <div class="tool-group palette hidden" id="palette-facility">
      <select id="facility-type"></select>
    </div>
    <div class="tool-group palette hidden" id="palette-station">
      <select id="station-type"></select>
    </div>
    <div class="tool-group palette hidden" id="palette-event">
      <select id="event-type"></select>
      <label class="radius">반경 <input id="event-radius" type="number" min="500" step="500" value="4000">m</label>
    </div>

    <div class="tool-group">
      <button id="btn-finish" title="현재 도형 닫기/완료 (Enter)">완료</button>
      <button id="btn-undo" title="실행 취소 (Ctrl+Z)" disabled>↶ 취소</button>
      <button id="btn-redo" title="다시 실행 (Ctrl+Y)" disabled>↷ 재실행</button>
      <button id="btn-delete" title="선택 삭제 (Del)" disabled>🗑 삭제</button>
    </div>

    <div class="tool-group readout" id="readout"></div>
  </div>

  <main>
    <section class="map-wrap">
      <canvas id="map" width="900" height="675"></canvas>
      <div id="warn" class="warn hidden"></div>
      <div id="legend" class="legend"></div>
    </section>

    <aside class="side">
      <div id="inspector" class="inspector hidden"></div>
      <div id="panel" class="panel">
        <div class="placeholder">지형을 선택하고 제출물을 불러오거나 도구로 직접 그려 보세요.</div>
      </div>
    </aside>
  </main>

  <script src="/web/app.js"></script>
</body>
</html>
